<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>How to Grade Source Reliability During a Crisis</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231c2420'/%3E%3Ctext x='32' y='39' font-size='22' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='700'%3ECI%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <nav class="nav" aria-label="Blog navigation">
        <a class="brand" id="home-link" href="../">
          <span class="brand-mark">CI</span>
          <span>test blog</span>
        </a>
        <div class="page-actions">
          <a class="button" id="raw-html" href="#">HTML</a>
          <a class="button primary" id="metadata" href="#">Metadata</a>
        </div>
      </nav>
    </header>

    <main class="shell" id="content">
      <section class="article-head">
        <p class="eyebrow" id="category">Blog</p>
        <h1 id="page-title">Loading article...</h1>
        <p id="excerpt"></p>
        <div class="meta-row">
          <span class="pill" id="published-date">Date</span>
          <span class="pill" id="reading-time">Read time</span>
        </div>
      </section>

      <figure class="hero-media">
        <picture>
          <source id="featured-source" srcset="" type="image/webp" />
          <img id="featured-image" src="" alt="" width="1200" height="800" />
        </picture>
        <figcaption class="hero-caption" id="image-caption"></figcaption>
      </figure>

      <section class="layout">
        <article class="article-wrap">
          <div class="article" id="article"></div>
        </article>
        <aside class="support" id="support" aria-label="Supporting blog data"></aside>
      </section>
    </main>

    <script src="../assets/blog-page.js" data-dir="../blog-01" data-home="../"></script>
  </body>
</html>
