<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Decision Rights by Design: Separating Analysis Owner and Decision Owner</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2318221d'/%3E%3Ctext x='32' y='39' font-size='22' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='700'%3EDR%3C/text%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="A practical guide to separating analysis ownership from final decision authority in high-stakes work using decision-rights models."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="Decision Rights by Design: Separating Analysis Owner and Decision Owner" />
    <meta
      property="og:description"
      content="A practical guide to separating analysis ownership from final decision authority in high-stakes work using decision-rights models."
    />
    <meta property="og:image" content="featured-image.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Decision Rights by Design: Separating Analysis Owner and Decision Owner" />
    <meta
      name="twitter:description"
      content="A practical guide to separating analysis ownership from final decision authority in high-stakes work using decision-rights models."
    />
    <meta name="twitter:image" content="featured-image.webp" />
    <style>
      :root {
        color-scheme: light;
        --ink: #18221d;
        --muted: #5d665f;
        --line: #d8ded6;
        --surface: #ffffff;
        --panel: #f7f2ea;
        --accent: #1f7a68;
        --accent-dark: #165949;
        --gold: #b26d21;
        --shadow: 0 22px 70px rgba(24, 34, 29, 0.12);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fbfaf7;
        color: var(--ink);
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      a {
        color: var(--accent-dark);
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }

      img {
        display: block;
        max-width: 100%;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        border-bottom: 1px solid rgba(216, 222, 214, 0.85);
        background: rgba(251, 250, 247, 0.9);
        backdrop-filter: blur(18px);
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: 12px 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        font-weight: 750;
        letter-spacing: 0;
      }

      .brand-mark {
        display: grid;
        flex: 0 0 34px;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 8px;
        background: var(--ink);
        color: #fff;
        font-size: 0.88rem;
      }

      .brand span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .nav-actions {
        display: flex;
        flex: 0 0 auto;
        gap: 8px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
      }

      .button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .hero {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: clamp(30px, 5vw, 64px) 0 clamp(36px, 5vw, 58px);
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: clamp(24px, 4vw, 38px);
        justify-items: center;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--gold);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3 {
        line-height: 1.1;
        letter-spacing: 0;
      }

      h1 {
        margin: 0;
        max-width: 980px;
        font-size: clamp(2.25rem, 4.2vw, 4.25rem);
        text-wrap: balance;
      }

      .dek {
        max-width: 820px;
        margin: 22px 0 0;
        color: var(--muted);
        font-size: clamp(1.02rem, 1.45vw, 1.2rem);
        text-wrap: balance;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 28px;
      }

      .meta-pill {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        max-width: 100%;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.7);
        color: var(--muted);
        font-size: 0.88rem;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .meta-pill:last-child {
        max-width: min(100%, 620px);
        border-radius: 8px;
      }

      .hero-media {
        overflow: hidden;
        width: min(980px, 100%);
        border: 1px solid rgba(216, 222, 214, 0.95);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .hero-media img {
        width: 100%;
        height: auto;
        object-fit: contain;
        background: #eef1ed;
      }

      .hero-caption {
        padding: 12px 14px 14px;
        color: var(--muted);
        font-size: 0.84rem;
        text-align: left;
      }

      main {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding-bottom: 64px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        justify-items: center;
        gap: clamp(42px, 7vw, 72px);
        align-items: start;
      }

      .article-wrap {
        width: min(780px, 100%);
        min-width: 0;
      }

      .article {
        padding-top: 10px;
      }

      .article p {
        margin: 0 0 18px;
      }

      .article h1 {
        display: none;
      }

      .article h2 {
        margin: 46px 0 16px;
        font-size: clamp(1.55rem, 2.3vw, 2.2rem);
      }

      .article h3 {
        margin: 32px 0 12px;
        font-size: 1.35rem;
      }

      .article p,
      .article li {
        color: #26312b;
        font-size: clamp(1rem, 1vw, 1.06rem);
      }

      .article ul,
      .article ol {
        padding-left: 1.25rem;
      }

      .article li + li {
        margin-top: 6px;
      }

      .article table {
        display: block;
        width: 100%;
        overflow-x: auto;
        margin: 28px 0;
        border-collapse: collapse;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .article th,
      .article td {
        min-width: 180px;
        padding: 13px 14px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      .article th {
        background: #eef4ef;
        color: var(--ink);
        font-size: 0.88rem;
        text-transform: uppercase;
      }

      .sidebar {
        width: 100%;
        position: static;
        display: grid;
        grid-template-columns: minmax(220px, 0.75fr) minmax(260px, 0.85fr) minmax(360px, 1.4fr);
        gap: 16px;
        min-width: 0;
      }

      .panel {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 14px 40px rgba(24, 34, 29, 0.06);
      }

      .panel-inner {
        padding: 18px;
      }

      .panel h2 {
        margin: 0 0 12px;
        font-size: 1.03rem;
      }

      .keyword-list,
      .resource-list,
      .source-list {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .keyword-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .keyword-list li {
        min-width: 0;
        border-radius: 6px;
        background: var(--panel);
        padding: 7px 9px;
        color: #47524b;
        font-size: 0.78rem;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .resource-item,
      .source-item {
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }

      .resource-item:first-child,
      .source-item:first-child {
        border-top: 0;
        padding-top: 0;
      }

      .resource-item a,
      .source-item a {
        font-weight: 750;
      }

      .source-domain,
      .resource-note {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .source-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        max-height: none;
        overflow: auto;
        padding-right: 0;
        column-gap: 14px;
      }

      audio {
        width: 100%;
        margin-top: 8px;
      }

      .loading,
      .error {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        background: var(--surface);
        color: var(--muted);
      }

      @media (max-width: 980px) {
        .sidebar {
          grid-template-columns: 1fr 1fr;
        }

        .panel:last-child {
          grid-column: 1 / -1;
        }

        .nav {
          align-items: flex-start;
          flex-direction: column;
        }

        .nav-actions {
          width: 100%;
        }

        .button {
          flex: 1 1 0;
        }
      }

      @media (max-width: 540px) {
        .topbar {
          position: static;
        }

        .nav {
          gap: 12px;
          padding: 10px 0;
        }

        .brand-mark {
          width: 30px;
          height: 30px;
          flex-basis: 30px;
          font-size: 0.78rem;
        }

        .button {
          min-height: 36px;
          padding: 0 10px;
          font-size: 0.84rem;
        }

        .hero {
          padding-top: 24px;
        }

        .keyword-list {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: clamp(2rem, 10.5vw, 2.85rem);
        }

        .hero,
        main,
        .nav {
          width: min(100% - 24px, 1120px);
        }

        .hero-grid {
          gap: 20px;
        }

        .dek {
          margin-top: 16px;
          font-size: 1rem;
        }

        .meta-row {
          gap: 8px;
          margin-top: 20px;
        }

        .meta-pill {
          border-radius: 8px;
          font-size: 0.8rem;
          padding: 7px 9px;
        }

        .hero-caption {
          font-size: 0.76rem;
          line-height: 1.45;
        }

        .layout {
          gap: 32px;
        }

        .sidebar,
        .source-list {
          grid-template-columns: 1fr;
        }

        .panel:last-child {
          grid-column: auto;
        }

        .article h2 {
          margin-top: 36px;
          font-size: 1.48rem;
        }

        .article p,
        .article li {
          font-size: 0.96rem;
        }

        .article th,
        .article td {
          min-width: 160px;
          padding: 11px 12px;
        }

        .panel-inner {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <nav class="nav" aria-label="Demo navigation">
        <div class="brand">
          <span class="brand-mark">DR</span>
          <span id="nav-title">Blog Demo</span>
        </div>
        <div class="nav-actions">
          <a class="button" href="blog.html">Raw HTML</a>
          <a class="button primary" href="blog.json">Metadata</a>
        </div>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-grid">
        <div>
          <p class="eyebrow" id="category">Workflow</p>
          <h1 id="title">Decision Rights by Design</h1>
          <p class="dek" id="excerpt">Loading article metadata...</p>
          <div class="meta-row" aria-label="Article metadata">
            <span class="meta-pill" id="published-date">Published</span>
            <span class="meta-pill" id="reading-time">Reading time</span>
            <span class="meta-pill" id="topic">Topic</span>
          </div>
        </div>
        <figure class="hero-media">
          <picture>
            <source srcset="featured-image.webp" type="image/webp" />
            <img id="featured-image" src="featured-image.png" alt="" width="1200" height="800" />
          </picture>
          <figcaption class="hero-caption" id="image-caption"></figcaption>
        </figure>
      </div>
    </section>

    <main>
      <div class="layout">
        <article class="article-wrap">
          <div id="article" class="article loading">Loading blog content...</div>
        </article>

        <aside class="sidebar" aria-label="Supporting blog data">
          <section class="panel">
            <div class="panel-inner">
              <h2>Keywords</h2>
              <ul class="keyword-list" id="keywords"></ul>
            </div>
          </section>

          <section class="panel">
            <div class="panel-inner">
              <h2>Generated Media</h2>
              <ul class="resource-list" id="resources"></ul>
            </div>
          </section>

          <section class="panel">
            <div class="panel-inner">
              <h2>Sources</h2>
              <ul class="source-list" id="sources"></ul>
            </div>
          </section>
        </aside>
      </div>
    </main>

    <script>
      const byId = (id) => document.getElementById(id);

      async function loadJson(path) {
        const response = await fetch(path);
        if (!response.ok) {
          throw new Error(`Unable to load ${path}`);
        }
        return response.json();
      }

      async function loadText(path) {
        const response = await fetch(path);
        if (!response.ok) {
          throw new Error(`Unable to load ${path}`);
        }
        return response.text();
      }

      function formatDate(value) {
        if (!value) return "Published date unavailable";
        return new Intl.DateTimeFormat("en", {
          month: "short",
          day: "numeric",
          year: "numeric",
        }).format(new Date(`${value}T00:00:00`));
      }

      function makeLink(label, url, note) {
        const li = document.createElement("li");
        li.className = "resource-item";
        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.rel = "noreferrer";
        a.textContent = label;
        li.append(a);
        if (note) {
          const span = document.createElement("span");
          span.className = "resource-note";
          span.textContent = note;
          li.append(span);
        }
        return li;
      }

      function renderMetadata(meta) {
        document.title = meta.seoTitle || meta.title || document.title;
        byId("nav-title").textContent = meta.category ? `${meta.category} Demo` : "Blog Demo";
        byId("category").textContent = meta.category || "Blog";
        byId("title").textContent = meta.title || "Untitled Blog";
        byId("excerpt").textContent = meta.excerpt || "";
        byId("published-date").textContent = formatDate(meta.publishedDate);
        byId("reading-time").textContent = meta.readingTimeMinutes
          ? `${meta.readingTimeMinutes} min read`
          : "Reading time unavailable";
        byId("topic").textContent = meta.topic || meta.category || "Article";
        byId("featured-image").alt = meta.imageAltText || "";
        byId("image-caption").textContent = meta.imageAltText || "";

        const keywordList = byId("keywords");
        keywordList.replaceChildren(
          ...(meta.keywords || []).map((keyword) => {
            const li = document.createElement("li");
            li.textContent = keyword;
            return li;
          }),
        );
      }

      function renderMedia(media) {
        const resources = byId("resources");
        const items = [];

        if (media?.podcast?.sourceUrls?.audio) {
          const li = makeLink("Podcast audio", media.podcast.sourceUrls.audio, "Completed generated audio");
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.preload = "none";
          audio.src = media.podcast.sourceUrls.audio;
          li.append(audio);
          items.push(li);
        }

        if (media?.document?.sourceUrls?.pdf) {
          items.push(makeLink("Generated PDF", media.document.sourceUrls.pdf, "Completed document export"));
        }

        const presentationUrl =
          media?.presentation?.presentationUrl || media?.presentation?.sourceUrls?.presentation;
        if (presentationUrl) {
          items.push(makeLink("Presentation", presentationUrl, "Completed presentation share"));
        }

        resources.replaceChildren(...items);
      }

      function renderSources(data) {
        const sources = byId("sources");
        const items = (data.sources || []).map((source) => {
          const li = document.createElement("li");
          li.className = "source-item";
          const a = document.createElement("a");
          a.href = source.url;
          a.target = "_blank";
          a.rel = "noreferrer";
          a.textContent = source.title;
          const domain = document.createElement("span");
          domain.className = "source-domain";
          domain.textContent = source.publishedAt
            ? `${source.domain} / ${formatDate(source.publishedAt.slice(0, 10))}`
            : source.domain;
          li.append(a, domain);
          return li;
        });
        sources.replaceChildren(...items);
      }

      async function init() {
        try {
          const [meta, articleHtml, externalMedia, sources] = await Promise.all([
            loadJson("blog.json"),
            loadText("blog.html"),
            loadJson("external-media.json"),
            loadJson("sources.json"),
          ]);

          renderMetadata(meta);
          renderMedia(externalMedia);
          renderSources(sources);

          const article = byId("article");
          article.classList.remove("loading");
          article.innerHTML = articleHtml;
        } catch (error) {
          byId("article").className = "error";
          byId("article").textContent =
            "The blog demo could not load one or more export files. Serve this folder through a static web server or GitHub Pages.";
          console.error(error);
        }
      }

      init();
    </script>
  </body>
</html>
