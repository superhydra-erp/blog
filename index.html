<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test Blog</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231c2420'/%3E%3Ctext x='32' y='39' font-size='22' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='700'%3ECI%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <nav class="nav" aria-label="Blog navigation">
        <a class="brand" href="./">
          <span class="brand-mark">CI</span>
          <span>Test Blog</span>
        </a>
      </nav>
    </header> 

    <main class="shell">
      <section class="hero compact">
        <p class="eyebrow">Crisis Intelligence</p>
        <h1>Test Blog</h1>
        <p class="dek">Two source-backed articles with generated media and reference packs.</p>
      </section>

      <section class="card-grid" id="card-grid" aria-label="Blog articles">
        <div class="loading">Loading blog cards...</div>
      </section>
    </main>

    <script>
      const BLOGS = [
        { dir: "blog-01", url: "grade-source-reliability-during-crisis/" },
        { dir: "blog-02", url: "intelligence-requirements-framework-fast-moving-crises/" },
      ];

      const grid = document.getElementById("card-grid");

      function formatDate(value) {
        return new Intl.DateTimeFormat("en", {
          month: "short",
          day: "numeric",
          year: "numeric",
        }).format(new Date(`${value}T00:00:00`));
      }

      function trimText(text, limit) {
        if (!text || text.length <= limit) return text || "";
        return `${text.slice(0, limit).trim()}...`;
      }

      function cardTemplate(blog, meta) {
        return `
          <a class="short-card" href="${blog.url}">
            <img src="${blog.dir}/${meta.featuredImage || "featured-image.webp"}" alt="${meta.imageAltText || ""}" width="1200" height="800" />
            <span class="card-kicker">${meta.category || "Blog"}</span>
            <h2>${meta.title}</h2>
            <p>${trimText(meta.excerpt, 170)}</p>
            <span class="card-meta">${formatDate(meta.publishedDate)} / ${meta.readingTimeMinutes || "?"} min read</span>
          </a>
        `;
      }

      async function init() {
        try {
          const cards = await Promise.all(
            BLOGS.map(async (blog) => {
              const response = await fetch(`${blog.dir}/blog.json`);
              if (!response.ok) throw new Error(`Unable to load ${blog.dir}/blog.json`);
              return cardTemplate(blog, await response.json());
            }),
          );
          grid.innerHTML = cards.join("");
        } catch (error) {
          grid.innerHTML = `<div class="error">Could not load blog cards.</div>`;
          console.error(error);
        }
      }

      init();
    </script>
  </body>
</html>
